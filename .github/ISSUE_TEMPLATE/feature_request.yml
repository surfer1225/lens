name: Feature request
description: Suggest something Lens should do
labels: ["enhancement"]

body:
  - type: markdown
    attributes:
      value: |
        Lens deliberately stays small and keyboard-first. Some things are
        out of scope on purpose — drag-to-edge snapping, automatic tiling,
        and anything needing SIP to be disabled. See the README's
        Alternatives section if one of those is what you are after.

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: >
        Describe the workflow, not the implementation. Knowing the underlying
        problem often surfaces a better answer than the feature first imagined.
      placeholder: >
        I run a terminal and an editor side by side, but the split I want is
        40/60, not 50/50, and I have to nudge it by hand every time.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you have in mind
      description: Optional. Shortcuts, settings, or behaviour you would expect.

  - type: textarea
    id: alternatives
    attributes:
      label: How you work around it today
      description: >
        Including whether another tool does this well. Prior art is useful,
        not a mark against the idea.
